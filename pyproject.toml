[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-forecaster"
version = "0.1.0"
description = "LSTM training pipeline for 4-scenario power management forecaster"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]

[project.scripts]
lstm-forecaster = "lstm_forecaster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lstm_forecaster*"]
